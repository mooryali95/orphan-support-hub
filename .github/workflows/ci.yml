name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── فحوص قاعدة البيانات ───────────────────────────────────────────
  # مستقلة عن npm عمداً: هي بوابة العمل الأمني، فلا يصحّ أن يُسقطها فشل
  # في تركيب الحزم. تحتاج psql وPostgres فقط.
  database:
    name: RLS و سلسلة الهجرات
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: تثبيت عميل psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      # يطبّق السلسلة على قاعدة نظيفة بترتيب المستودع، فيكشف أي هجرة
      # تعتمد على أخرى تليها — وهو كسر لا يظهر على قاعدة قائمة.
      - name: تطبيق الهجرات وتشغيل فحوص الاستغلال
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./scripts/db-test.sh

  # ── فحوص الواجهة ──────────────────────────────────────────────────
  web:
    name: أنواع ووبر وتنسيق واختبارات وبناء
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ARC-07: نسخةٌ مثبّتة لا latest — ترقية bun تغيّر الحلّ والبناء بلا التزام.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # bun.lock يشير إلى مرآة Lovable الخاصة (europe-west1-npm.pkg.dev)، وهي لا
      # تُبلغ من العدّاء. فتُعاد كتابة عناوين المرآة إلى registry.npmjs.org في
      # نسخة العدّاء وحدها (لا تُلتزم)، ثم يُركَّب **بالقفل** كما هو: النسخ
      # وبصمات integrity نفسها. ولا رجوع إلى تركيبٍ بلا قفل أبداً — قفلٌ لا
      # يُحلّ يُسقط CI بدل أن يبني نسخاً لم يُراجعها أحد.
      - name: تركيب الحزم من القفل
        run: |
          sed -i 's#https://europe-west1-npm.pkg.dev/lovable-core-prod/sandbox-npm-cache/#https://registry.npmjs.org/#g' bun.lock
          if grep -q 'europe-west1-npm.pkg.dev' bun.lock; then
            echo "::error::بقي في bun.lock عنوانٌ للمرآة لم تُعَد كتابته"; exit 1
          fi
          bun install --frozen-lockfile
          git checkout -- bun.lock

      # تقريرٌ لا بوّابة: ثغرةٌ في تبعيةٍ غير مباشرة لا تُصلح في الدمج نفسه،
      # لكنّها تُرى في كلّ تشغيل (Summary) حتى تُعالَج.
      - name: تدقيق التبعيات (تقرير)
        continue-on-error: true
        run: |
          {
            echo '### bun audit'
            echo '```'
            bun audit 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: فحص الأنواع
        run: bun run typecheck

      - name: الوبر
        run: bun run lint

      - name: التنسيق
        run: bun run format:check

      - name: اختبارات الوحدة
        run: bun run test

      - name: البناء
        run: bun run build

      # اختبار المتصفّح (scripts/e2e-smoke.mjs) لا يُشغَّل هنا عمداً: /support
      # والرحلة تحتاج بيانات Supabase حيّة (كتالوج الدعم)، والعدّاء لا يملك
      # قاعدةً ولا يصحّ أن يضرب قاعدة الإنتاج. يُشغَّل يدوياً على نشرٍ قائم:
      #   BASE_URL=https://… node scripts/e2e-smoke.mjs
      # أو محلّياً على البناء: node scripts/serve-worker.mjs & node scripts/e2e-smoke.mjs
